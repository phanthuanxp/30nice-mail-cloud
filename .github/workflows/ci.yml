name: Verify Mail Cloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mail-cloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const vulnerabilities = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via || []).filter(value => typeof value === 'object').map(value => ({
              title: value.title,
              url: value.url,
              range: value.range,
              severity: value.severity,
            })),
          }));
          console.log(JSON.stringify({ summary: report.metadata?.vulnerabilities, vulnerabilities }, null, 2));
          NODE
          exit "$audit_status"
      - name: Type check
        run: npm run typecheck
      - name: Verify authentication and authorization
        run: npm run test:auth
      - name: Verify mailbox and tenant provisioning
        run: |
          npm run test:mailbox
          npm run test:domain
      - name: Verify Mailcow adapter
        run: npm run test:mailcow
      - name: Verify webmail features
        run: |
          npm run test:webmail-content
          npm run test:webmail-bcc
          npm run test:webmail-contacts
          npm run test:webmail-search
          npm run test:webmail-send-rate
          npm run test:webmail-login-rate
          npm run test:webmail-trash-delete
          npm run test:webmail-request-sequence
      - name: Build customer portal
        run: npm run build
      - name: Check guarded VPS deploy script syntax
        run: bash -n infra/deploy-vps.sh

